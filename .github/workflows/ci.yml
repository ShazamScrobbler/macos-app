name: CI
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Tools
        run: brew install xcodegen shellcheck
      - name: Boundaries
        run: shellcheck scripts/*.sh && scripts/check-boundaries.sh
      - name: Kit tests
        run: swift test --package-path Kit
      - name: Build app (universal, ad-hoc)
        run: |
          cd App && xcodegen generate
          xcodebuild -project ShazamScrobbler.xcodeproj -scheme ShazamScrobbler -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY=- build
          archs=$(lipo -archs build/Build/Products/Release/ShazamScrobbler.app/Contents/MacOS/ShazamScrobbler)
          echo "archs: $archs"
          echo "$archs" | grep -q x86_64 && echo "$archs" | grep -q arm64
