name: CI
on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Tools
        run: brew install xcodegen shellcheck
      - name: Boundaries
        run: shellcheck scripts/*.sh && scripts/check-boundaries.sh
      - name: Kit tests
        run: swift test --package-path Kit
      - name: Build app (universal, ad-hoc)
        run: |
          cd App && xcodegen generate
          xcodebuild -project ShazamScrobbler.xcodeproj -scheme ShazamScrobbler -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY=- build
          lipo -archs build/Build/Products/Release/ShazamScrobbler.app/Contents/MacOS/ShazamScrobbler
